services:
  db:
    image: mariadb:11
    container_name: fulgencia-db
    # Dev-only DB on a laptop: never start on its own. Bring it up explicitly
    # with `pnpm db:up` and stop it with `pnpm db:down` (data persists in the
    # named volume). Do not restore `unless-stopped`.
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-fulgencia}
      MARIADB_USER: ${DB_USER:-fulgencia}
      MARIADB_PASSWORD: ${DB_PASSWORD:-fulgencia}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - fulgencia-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fulgencia-db-data:

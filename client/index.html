<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fulgencia Register</title>
    <link rel="icon" href="./assets/img/favicon.ico" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/views/login.css" />
    <link rel="stylesheet" href="./styles/views/inicio.css" />
    <link rel="stylesheet" href="./styles/views/estudiantes.css" />
    <link rel="stylesheet" href="./styles/views/inscripcion.css" />
    <link rel="stylesheet" href="./styles/views/placeholder.css" />
    <script>
      // Apply the stored (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('fulgencia-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          /* localStorage unavailable: keep the default theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
